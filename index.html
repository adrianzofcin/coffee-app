<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <title>Coffee</title>
        <meta name="description" content="Personal coffee companion: beans, recipes and brews." />
        <meta name="theme-color" content="#FAF6F1" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Coffee" />
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
        <script>
            // Apply the saved theme before first paint to avoid a flash.
            ;(function () {
                try {
                    var t = localStorage.getItem('coffee-app-theme') || 'system'
                    var dark =
                        t === 'dark' ||
                        (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
                    if (dark) document.documentElement.classList.add('dark')
                } catch (e) {}
            })()
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
